[package]
name = "flac-spike"
version = "0.1.0"
edition = "2024"

# The perf-gate spike ROM (Phase 1 step 4) — see ../../FLAC.md, "Perf gate
# spike — concrete plan and validation process (2026-09-18)".
#
# PR 1 scope: scaffold + embedded clips. Two ~10 s arms of the same
# deterministic source (FIXED-only at -l 0, LPC at -l 4), sliced to raw frame
# regions with a generated offset table (the deliberate stand-in for the GAFP
# manifest). The ROM boots and verifies its embedded region hashes; the host
# witness tests (tests/spike_witness.rs) decode the exact embedded bytes
# bit-exactly against `flac -d` reference PCM.
#
# Standalone workspace (own Cargo.toml + [workspace]), config INHERITED from
# the repo root — do NOT add a local .cargo/config.toml: cargo concatenates
# target.<triple>.rustflags across config layers, and a local re-declaration
# links `-Tgba.ld` twice (FLAC.md, "Second leak variant").
#
#   make native-spike-rom    build + fix the spike ROM (this host)
#   make spike-test          host witness tests (correctness of the assets)
#
# The root ROM crate stays FLAC-free; the baseline .gba never sees this code.

[dependencies]
# `iwram-pin`: keep the E2b LEADING_ONES table pinned to .iwram in this live
# GBA image (the pin is off by default in the core since the split-proposal
# ladder step 2, 2026-11-02 — GBA ROM crates opt in).
flac-lite = { path = "../../crates/flac-lite", features = ["iwram-pin"] }

# The GBA OVERLAY crate, optional and off in every shipped build: this is the
# first time anything in this repository links `flac-lite-gba` at all, which is
# what 6a-3's link witness needs (an rlib has no link step, so no gate on the
# overlay crate itself can answer a codegen question — that limit is written in
# the Makefile's overlay section and in the crate's own docs).
#
# NO features on the dependency line, on purpose: each arm's feature below
# selects exactly the overlay feature it needs. Until 6a-5 this line carried
# `features = ["rice-twin"]`, which was fine while the overlay had one module —
# but 6a-5 needs an *asm-only* image (the product shape), and a hard `rice-twin`
# here would drag the Rust mechanism — and through it the core's `rice-hybrid` —
# into every image that links the overlay at all. `item6a3-twin` below keeps
# that rung's exact configuration by naming the feature itself.
flac-lite-gba = { path = "../../crates/flac-lite-gba", optional = true }

# The sample-rate ROM flow (FLAC.md "Sample-rate reduction" Part 1). The
# feature exists to gate the rate bin + rate witness so the default spike
# build NEVER sees them: `make native-spike-rom` / `make spike-test` compile
# without it (required-features targets are excluded when the feature is
# off — verified: a required-features [[bin]] with a missing path file does
# not break default `cargo build` / `cargo test` / `cargo fmt`). The flow's
# generated modules (src/rate_assets.rs, src/rate_pcm.rs) are TEMPORARY
# (gitignored, `make clean` removes): build `make rate-assets` first.
[features]
rate-assets = []

# Item 6 PR 6a-3's codegen arms (FLAC.md, the 6a-3 record; src/item6a3_probe.rs
# carries the design). Two features rather than one because the point is a
# comparison with exactly one variable: T names a kernel whose `impl RiceKernel`
# block lives in ANOTHER crate, H names the core's own hybrid twin, and both reach
# it through the same call shape in the same file. `item6a3-twin` therefore brings
# in the overlay, whose own `rice-twin` feature forwards to `flac-lite/rice-hybrid`
# — so both arms build with the SAME core feature set, which is what makes T-vs-H a
# measurement of the crate boundary and not of a feature flag. Off by default, and
# nothing in the shipped ROM build (`make native-spike-rom`) enables either.
item6a3-twin = ["dep:flac-lite-gba", "flac-lite-gba/rice-twin"]
item6a3-hybrid = ["flac-lite/rice-hybrid"]
# Control arm, not an implementation of the seam: the core's twin module is
# compiled and NOTHING reaches it — item 5 PR 3's shape, in this instrument. Its
# only job is to say whether the second mechanism has to be reachable to cost
# anything, or whether presence in a codegen unit is enough. The probe module is
# not compiled under this feature, so no call site exists.
item6a3-present = ["flac-lite/rice-hybrid"]

# 6a-5's realisation arms (FLAC.md split-ladder item 6, PR 6a-5; the pass lives
# in src/main.rs under `mod item6a5`). Each arm selects a Rice kernel by type at
# the *product* call path (`driver::decode_one_with` -> `frame::decode_frame_with`),
# never through a vendored decode loop: E10/E9 priced vendored copies, and "the win
# lives in a probe but not in the product path" is the failure 6a-5 exists to rule
# out. All three are OFF by default, so the shipped instrument image (and every
# number recorded before this rung) is unchanged.
#
#   item6a5-rust  the Rust arm: the overlay's `rice-twin` (which forwards to the
#                 core's `rice-hybrid`), reached through the seam.
#   item6a5-asm   the asm arm: the overlay's `rice-arm` (6a-4), and NOTHING else
#                 from the overlay. This is the *product shape*: one extra kernel
#                 in the link, no second mechanism.
#   item6a5-arms  both, for the three-way reading in one link. 6a-3 measured why
#                 this image cannot supply the control: a second `RiceKernel` body
#                 in the link re-decides inlining and moves the default path by
#                 ~168-199 K cycles/frame. So the paired deltas are read against
#                 `ctrl` *inside this image*, and the shipped-baseline comparison
#                 comes from the default image's own control run.
#
# Both arm features also turn on the overlay's `iwram-pin`. That is the product
# shape (6a-4 is where pin enablement landed) and it removes an asymmetry the
# first arm images had: this crate already pins the CORE's `LEADING_ONES` table
# (`flac-lite` features `iwram-pin`), so an arm whose own three tables sat in ROM
# would be paying a read tax the control does not pay. With the pin on, the asm
# image's `.iwram` is 812 + 544 B — the three tables exactly — and `nm` shows
# them at `0x0300xxxx` rather than in `.rodata`.
item6a5-rust = ["dep:flac-lite-gba", "flac-lite-gba/rice-twin", "flac-lite-gba/iwram-pin"]
item6a5-asm = ["dep:flac-lite-gba", "flac-lite-gba/rice-arm", "flac-lite-gba/iwram-pin"]
item6a5-arms = ["item6a5-rust", "item6a5-asm"]

# 6a-5b's fourth measurement leg (plan-of-record 6a-5b; the pass lives in the
# same `mod item6a5` in src/main.rs). 6a-5's stack projection — the landed asm
# leg +48.2 c/sample against E10's vendored leg — is the one comparison in these
# records taken across TWO images, which method-and-gates.md forbids, and whose
# own next paragraph measures the class of effect at -36,543/-202,529 c/frame on
# UNCHANGED control code. So the two realizations have to be timed in one link.
#
#   item6a5b-vendored  compiles src/e10.rs — the E10 archive's vendored decode
#                      path (its own reader, its own frame parser, its own ARM
#                      kernel, its own 544 B of pinned tables) — and adds the
#                      fourth window to the 6a-5 pass. It is NOT a `RiceKernel`
#                      arm and it turns on no core or overlay feature of its own:
#                      the point is that this leg shares nothing with the landed
#                      path except the bytes it decodes and the samples it must
#                      write. It DOES imply `item6a5-asm`, because a leg with
#                      nothing to be differential against measures nothing: the
#                      pair has to be in the link, and the manifest is what makes
#                      that a checked fact rather than a Makefile convention.
#
# OFF by default, like every other arm feature: a default build of this crate has
# no vendored decoder, no second kernel symbol and no `deny`-vs-`forbid`
# relaxation (see src/lib.rs), and the shipped instrument image is unchanged.
item6a5b-vendored = ["item6a5-asm"]

# 6a-7's width leg (plan-of-record 6a-7). `item6a6` moved the core's default
# arithmetic width to i32 but left its cycle marginal unread — a same-image pair
# needs both widths in one link. `src/wide.rs` is the pre-6a-6 i64 decode path,
# vendored; the pass times `ctrl` (i32), `wide` (i64) and `asm` (the landed
# kernel over the i32 default) in one calibration. It implies `item6a5-asm` so
# the stack and the width marginal are read in the same image. Off by default:
# a default build contains no second decoder, and every pre-6a-7 number stands.
item6a7-wide = ["item6a5-asm"]

# agb exists only for the GBA target, and it cannot build for the host triple
# — while the host witness tests (make spike-test) compile this crate's lib
# + tests natively. Gate by architecture: thumbv4t-none-eabi reports
# target_arch = "arm"; the macOS/Linux hosts are aarch64/x86_64. This mirrors
# what a per-target dependency in agb project templates does, and it keeps
# `cargo test --target <host>` free of the agb dependency graph entirely.
[target.'cfg(target_arch = "arm")'.dependencies]
agb = "0.25.0"

[[bin]]
name = "flac-spike"
path = "src/main.rs"
# `cargo test` must not build the ROM bin: it is a no_main GBA binary whose
# entry exists only under agb. The witness tests link against the lib alone.
test = false
bench = false

# The rate ROM (make native-rate-rom): real audio at a mixer-domain rate,
# measured. Gated by `rate-assets` so the committed spike ROM build is
# byte-identical to the E-menu's calibration image (coexistence contract,
# FLAC.md rate-proposal amendment).
[[bin]]
name = "flac-rate-spike"
path = "src/rate_main.rs"
required-features = ["rate-assets"]
test = false
bench = false

# The rate-play ROM (make native-rate-play-rom): FLAC decode INTO audible
# playback at the mixer-domain rate via the custom IRQ feeder (FLAC.md rate
# flow playback entry). Same `rate-assets` gate as the rate ROM — invisible
# to the committed spike build.
[[bin]]
name = "flac-rate-play"
path = "src/rate_play_main.rs"
required-features = ["rate-assets"]
test = false
bench = false

# The rate flow's host witness — same correctness-before-speed gate at the
# generated rate: bit-exact decode of the embedded bytes vs `flac -d` before
# any ROM number counts. Skipped (not failed) when rate-assets is off.
[[test]]
name = "rate_witness"
path = "tests/rate_witness.rs"
required-features = ["rate-assets"]

# 6a-5's arm witness: one transcription of "every arm decodes the committed
# clips to the pinned PCM, frame window by frame window". `required-features` is
# what makes "a default `make spike-test` builds no arm code" a checked statement
# — without it cargo would report the suite's absence as a green it did not earn
# (the same rule 6a-3/6a-4 used for their out-of-crate suites).
[[test]]
name = "item6a5_witness"
path = "tests/item6a5_witness.rs"
required-features = ["item6a5-arms"]

# 6a-5b's host witness for the vendored leg, carried from the E10 archive: the
# hybrid ARM variant decodes the committed clips to the reference PCM, agrees with
# the production driver frame by frame, and its vendored `fold_body.s` is pinned
# byte-identical to the one committed source (so the two kernels in the
# differential link really do share the fold). On the host the asm leg is the
# Rust twin; the assembled body is `overlay-kernel-test`'s and the ROM's own
# per-frame sample-equality witness. required-features: a default build has no
# e10 module, and a green that names nothing is a green that means nothing.
[[test]]
name = "e10_witness"
path = "tests/e10_witness.rs"
required-features = ["item6a5b-vendored"]

# 6a-7's host witness for the width leg: the vendored i64 path decodes the
# committed clips to the reference PCM and agrees with `driver::decode_one`
# frame window by frame window. `required-features` keeps a default build free
# of the second decoder — and keeps the suite's absence from reading as a green.
[[test]]
name = "item6a7_witness"
path = "tests/item6a7_witness.rs"
required-features = ["item6a7-wide"]

[workspace]

# Same profile choices as examples/flac_integration/: the release ROM is what
# PR 3 will measure, so optimization must match what ships to the emulator.
[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
