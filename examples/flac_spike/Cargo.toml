[package]
name = "flac-spike"
version = "0.1.0"
edition = "2024"

# The perf-gate spike ROM (Phase 1 step 4) — see ../../FLAC.md, "Perf gate
# spike — concrete plan and validation process (2026-09-18)".
#
# PR 1 scope: scaffold + embedded clips. Two ~10 s arms of the same
# deterministic source (FIXED-only at -l 0, LPC at -l 4), sliced to raw frame
# regions with a generated offset table (the deliberate stand-in for the GAFP
# manifest). The ROM boots and verifies its embedded region hashes; the host
# witness tests (tests/spike_witness.rs) decode the exact embedded bytes
# bit-exactly against `flac -d` reference PCM.
#
# Standalone workspace (own Cargo.toml + [workspace]), config INHERITED from
# the repo root — do NOT add a local .cargo/config.toml: cargo concatenates
# target.<triple>.rustflags across config layers, and a local re-declaration
# links `-Tgba.ld` twice (FLAC.md, "Second leak variant").
#
#   make native-spike-rom    build + fix the spike ROM (this host)
#   make spike-test          host witness tests (correctness of the assets)
#
# The root ROM crate stays FLAC-free; the baseline .gba never sees this code.

[dependencies]
# `iwram-pin`: keep the E2b LEADING_ONES table pinned to .iwram in this live
# GBA image (the pin is off by default in the core since the split-proposal
# ladder step 2, 2026-11-02 — GBA ROM crates opt in).
flac-lite = { path = "../../crates/flac-lite", features = ["iwram-pin"] }

# The GBA OVERLAY crate, optional and off in every shipped build: this is the
# first time anything in this repository links `flac-lite-gba` at all, which is
# what 6a-3's link witness needs (an rlib has no link step, so no gate on the
# overlay crate itself can answer a codegen question — that limit is written in
# the Makefile's overlay section and in the crate's own docs). Enabling it also
# turns on the overlay's `rice-twin`, i.e. the core's `rice-hybrid`; see the two
# feature entries below.
flac-lite-gba = { path = "../../crates/flac-lite-gba", features = ["rice-twin"], optional = true }

# The sample-rate ROM flow (FLAC.md "Sample-rate reduction" Part 1). The
# feature exists to gate the rate bin + rate witness so the default spike
# build NEVER sees them: `make native-spike-rom` / `make spike-test` compile
# without it (required-features targets are excluded when the feature is
# off — verified: a required-features [[bin]] with a missing path file does
# not break default `cargo build` / `cargo test` / `cargo fmt`). The flow's
# generated modules (src/rate_assets.rs, src/rate_pcm.rs) are TEMPORARY
# (gitignored, `make clean` removes): build `make rate-assets` first.
[features]
rate-assets = []

# Item 6 PR 6a-3's codegen arms (FLAC.md, the 6a-3 record; src/item6a3_probe.rs
# carries the design). Two features rather than one because the point is a
# comparison with exactly one variable: T names a kernel whose `impl RiceKernel`
# block lives in ANOTHER crate, H names the core's own hybrid twin, and both reach
# it through the same call shape in the same file. `item6a3-twin` therefore brings
# in the overlay, whose own `rice-twin` feature forwards to `flac-lite/rice-hybrid`
# — so both arms build with the SAME core feature set, which is what makes T-vs-H a
# measurement of the crate boundary and not of a feature flag. Off by default, and
# nothing in the shipped ROM build (`make native-spike-rom`) enables either.
item6a3-twin = ["dep:flac-lite-gba"]
item6a3-hybrid = ["flac-lite/rice-hybrid"]
# Control arm, not an implementation of the seam: the core's twin module is
# compiled and NOTHING reaches it — item 5 PR 3's shape, in this instrument. Its
# only job is to say whether the second mechanism has to be reachable to cost
# anything, or whether presence in a codegen unit is enough. The probe module is
# not compiled under this feature, so no call site exists.
item6a3-present = ["flac-lite/rice-hybrid"]

# agb exists only for the GBA target, and it cannot build for the host triple
# — while the host witness tests (make spike-test) compile this crate's lib
# + tests natively. Gate by architecture: thumbv4t-none-eabi reports
# target_arch = "arm"; the macOS/Linux hosts are aarch64/x86_64. This mirrors
# what a per-target dependency in agb project templates does, and it keeps
# `cargo test --target <host>` free of the agb dependency graph entirely.
[target.'cfg(target_arch = "arm")'.dependencies]
agb = "0.25.0"

[[bin]]
name = "flac-spike"
path = "src/main.rs"
# `cargo test` must not build the ROM bin: it is a no_main GBA binary whose
# entry exists only under agb. The witness tests link against the lib alone.
test = false
bench = false

# The rate ROM (make native-rate-rom): real audio at a mixer-domain rate,
# measured. Gated by `rate-assets` so the committed spike ROM build is
# byte-identical to the E-menu's calibration image (coexistence contract,
# FLAC.md rate-proposal amendment).
[[bin]]
name = "flac-rate-spike"
path = "src/rate_main.rs"
required-features = ["rate-assets"]
test = false
bench = false

# The rate-play ROM (make native-rate-play-rom): FLAC decode INTO audible
# playback at the mixer-domain rate via the custom IRQ feeder (FLAC.md rate
# flow playback entry). Same `rate-assets` gate as the rate ROM — invisible
# to the committed spike build.
[[bin]]
name = "flac-rate-play"
path = "src/rate_play_main.rs"
required-features = ["rate-assets"]
test = false
bench = false

# The rate flow's host witness — same correctness-before-speed gate at the
# generated rate: bit-exact decode of the embedded bytes vs `flac -d` before
# any ROM number counts. Skipped (not failed) when rate-assets is off.
[[test]]
name = "rate_witness"
path = "tests/rate_witness.rs"
required-features = ["rate-assets"]

[workspace]

# Same profile choices as examples/flac_integration/: the release ROM is what
# PR 3 will measure, so optimization must match what ships to the emulator.
[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
