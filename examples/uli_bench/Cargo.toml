[package]
name = "uli-bench"
version = "0.1.0"
edition = "2024"

# ULI2 decoder measurement ROM (Phase 1b): the on-target cycle harness for the
# portable `uli-lite` decoder and its four synthesis kernels.
#
# Standalone workspace, config INHERITED from the repo root — do NOT add a
# local .cargo/config.toml: cargo concatenates target.<triple>.rustflags across
# config layers, and a local re-declaration links `-Tgba.ld` twice.
#
#   make uli-bench-rom   build + fix the ROM
#   make uli-bench       build, run in headless mGBA, and write the log
#
# The corpus is the committed Phase 0 fixture, byte-for-byte, so the image is
# measured only after its own decode reproduces the C-reference album pins.

[features]
# Per-frame dump for attribution work: one CSV-ish line per frame with the
# measured window and the decoder's operation counts, fitted host-side. Off by
# default so the gate's log stays the record. Implies `verify`, because the dump
# exists to correlate cycles with counts.
per-frame = ["verify"]

# Compiles the product decoder's counters and format-rule diagnostics back in
# (`uli-lite-gba/verify`). Off by default: the gate measures the product build,
# which does not carry them (PR C-3b, ~30,000 cycles/frame). A `verify` build
# prints the per-arm operation counts and is the arm that witnesses `xover=0
# hfnz=0` for the product decoder itself.
verify = ["uli-lite-gba/verify"]

# Hand-written ARM FFT (PR C-1): the product decoder and `ArmKernels` use v3
# (`asm/fft_arm_v3.s`). The bench times v1/v2/v3 in isolation (`asmfft*` arms)
# and twins all three against the Rust ARM-mode `fft` on the ARM7TDMI. Off by
# default so the product frame in the default build is the Rust-kernel control.
asm-fft = ["uli-lite-gba/asm-fft"]

[dependencies]
uli-lite = { path = "../../crates/uli-lite", features = ["kernels"] }
# The overlay's ARM-mode, unchecked kernels (the measurement's second arm).
uli-lite-gba = { path = "../../crates/uli-lite-gba" }

[target.'cfg(target_arch = "arm")'.dependencies]
agb = "0.25.0"

[[bin]]
name = "uli-bench"
path = "src/main.rs"

[workspace]

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
