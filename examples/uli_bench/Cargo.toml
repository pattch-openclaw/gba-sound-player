[package]
name = "uli-bench"
version = "0.1.0"
edition = "2024"

# ULI2 decoder measurement ROM (Phase 1b): the on-target cycle harness for the
# portable `uli-lite` decoder and its four synthesis kernels.
#
# Standalone workspace, config INHERITED from the repo root — do NOT add a
# local .cargo/config.toml: cargo concatenates target.<triple>.rustflags across
# config layers, and a local re-declaration links `-Tgba.ld` twice.
#
#   make uli-bench-rom   build + fix the ROM
#   make uli-bench       build, run in headless mGBA, and write the log
#
# The corpus is the committed Phase 0 fixture, byte-for-byte, so the image is
# measured only after its own decode reproduces the C-reference album pins.

[features]
# Per-frame dump for attribution work: one CSV-ish line per frame with the
# measured window and the decoder's operation counts, fitted host-side. Off by
# default so the gate's log stays the record. Implies `verify`, because the dump
# exists to correlate cycles with counts.
per-frame = ["verify"]

# Compiles the product decoder's counters and format-rule diagnostics back in
# (`uli-lite-gba/verify`). Off by default: the gate measures the product build,
# which does not carry them (PR C-3b, ~30,000 cycles/frame). A `verify` build
# prints the per-arm operation counts and is the arm that witnesses `xover=0
# hfnz=0` for the product decoder itself.
verify = ["uli-lite-gba/verify"]

# Hand-written ARM FFT (PR C-1): the product decoder and `ArmKernels` use v3
# (`asm/fft_arm_v3.s`). The bench times v1/v2/v3 in isolation (`asmfft*` arms)
# and twins all three against the Rust ARM-mode `fft` on the ARM7TDMI. Off by
# default so the product frame in the default build is the Rust-kernel control.
asm-fft = ["uli-lite-gba/asm-fft"]

# Place only the FFT twiddle table in IWRAM (uli-lite-gba/iwram-tw).
iwram-tw = ["uli-lite-gba/iwram-tw"]

# All synthesis tables (PERM/PRE/POST/TW/WIN) in IWRAM (uli-lite-gba/iwram-tables).
# This is the C reference's own table layout; it fits now that the product stack
# is measured at 768 B, not the stale ~15 KiB figure.
iwram-tables = ["uli-lite-gba/iwram-tables"]

# **Measurement-only: by-difference attribution arms** (see PLAN-OF-RECORD.md
# "Critical path to real time", Step 0). Each flag removes exactly one part of
# the product frame so its share can be measured by difference. These are
# **timing-only**: the pins fail by construction, and a build with any of them on
# must never be quoted as a product number. The banner line `attrib mask=...`
# makes every log self-describing.
attrib-pre = ["uli-lite-gba/attrib-pre"]
attrib-fft = ["uli-lite-gba/attrib-fft"]
attrib-post = ["uli-lite-gba/attrib-post"]
attrib-ola = ["uli-lite-gba/attrib-ola"]
attrib-synth = ["uli-lite-gba/attrib-synth"]
attrib-entropy = ["uli-lite-gba/attrib-entropy"]
attrib-ms = ["uli-lite-gba/attrib-ms"]

# Sub-frame entropy attribution (PLAN-OF-RECORD.md, Step 0b): one layer inside
# `dec_chan` removed per arm, so the ~101,000 cycles the entropy/dequant path
# owns at the worst frame can be partitioned. Timing-only, same rules.
attrib-entropy-nolut = ["uli-lite-gba/attrib-entropy-nolut"]
attrib-entropy-nodequant = ["uli-lite-gba/attrib-entropy-nodequant"]
attrib-entropy-nowrite = ["uli-lite-gba/attrib-entropy-nowrite"]
attrib-entropy-reader = ["uli-lite-gba/attrib-entropy-reader"]
# Counts `huff_slow` hits (uli-lite-gba/attrib-count); printed as `prod8 slow_hits=`.
attrib-count = ["uli-lite-gba/attrib-count"]

# Per-frame timing dump for the attribution arms: one `pfc f=<frame> cyc=<net>`
# line per frame, printed outside the timed window. Deliberately independent of
# `per-frame` (which implies `verify` and so measures a different build): the
# attribution must be read from the product image, and a by-difference delta is
# only like-for-like when compared frame-for-frame.
attrib-dump = []

# The twiddle-table-in-`.iwram` placement A/B (`asmfft4iw`). Off by default:
# `iwram-tables` already puts the shipped `TW` in `.iwram`, so the arm compares
# the table against itself, and its 2,016 B copy is what pushed the
# `--features asm-fft` image past the IWRAM region — which is where the on-target
# asm twin lives. See `make uli-fft-twin`.
tw-iwram-arm = []

# The hand-written pre-twiddle (uli-lite-gba/asm-pre). Enable it to build the
# image that runs the `preasm` twin.
asm-pre = ["uli-lite-gba/asm-pre"]

[dependencies]
uli-lite = { path = "../../crates/uli-lite", features = ["kernels"] }
# The overlay's ARM-mode, unchecked kernels (the measurement's second arm).
uli-lite-gba = { path = "../../crates/uli-lite-gba" }

[target.'cfg(target_arch = "arm")'.dependencies]
agb = "0.25.0"

[[bin]]
name = "uli-bench"
path = "src/main.rs"

[workspace]

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
