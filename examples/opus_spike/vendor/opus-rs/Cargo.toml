# Vendored opus-rs 0.1.34 (crates.io), patched for thumbv4t-none-eabi.
# Provenance + patch inventory: PATCHES.md (next to this file). The upstream
# manifest is reproduced here with its dev-dependencies / examples / tests /
# benches stripped — this vendored copy is a decoder dependency, never a
# workspace of its own ([workspace] below detaches it from opus_spike).

[package]
edition = "2024"
name = "opus-rs"
version = "0.1.34"
authors = ["jinti<shenjindi@fourz.cn>"]
description = "pure Rust implementation of Opus codec (VENDORED + PATCHED, see PATCHES.md)"
license = "BSD-3-Clause"
repository = "https://github.com/restsend/opus-rs"

[features]
default = ["std", "heap"]
heap = ["std"]
libm = ["dep:libm"]
std = []
# VENDOR PATCH 5 (PATCHES.md): opt-IN host NEON. Every aarch64 SIMD cfg is
# gated behind `all(target_arch = "aarch64", feature = "host-simd")`. OFF is
# the product/ROM equivalence class: the host walk then executes the same
# scalar arithmetic the thumbv4t soft-float target runs (the NEON paths fuse
# mul+add via `vfmaq_f32`, which ARM7TDMI cannot). ON reproduces upstream
# 0.1.34 host behavior exactly. thumbv4t never compiles NEON either way.
host-simd = []

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }
# VENDOR PATCH dependency: `portable_atomic::AtomicU8` replaces the
# `core::sync::atomic::AtomicU8` ARMv4T cannot provide (PATCHES.md).
# Bare on the host (native AtomicU8 there needs no feature); the ARM
# bare-metal target mirrors agb 0.25's exact set (`unsafe-assume-single-core`
# + `fallback`, NEVER `critical-section` — the first real link compile_error!d
# on critical-section coexisting with agb's cfg, and the unconditional
# single-core cfg compile_error!s on non-ARM hosts; PATCHES.md note 1a).
portable-atomic = { version = "1", default-features = false }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["unsafe-assume-single-core", "fallback"] }

[lib]
name = "opus_rs"
path = "src/lib.rs"

[workspace]
