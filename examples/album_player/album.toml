# The Album Player's gate fixture — the one TRACKED artifact of an album build.
#
# Everything this file implies (`ALBM1`, the per-track `GAFP` blobs, the generated
# `src/assets.rs`) is build output and gitignored (ALBUM-PLAYER.md §2.3, §9.0,
# `.gitignore`); committing the config and never the assets is what makes an
# album reviewable and rebuildable by someone who does not have this machine's
# audio library. `make clean` removes every generated path, this file stays.
#
# Phase 1 (A3a) reads only these three sections. `[art]`, `[viz]`, `[ui]` and
# `[game]` arrive with Phase 3's verdict set (§9.0) and are refused by name until
# then — `scripts/album_bake.py` will not silently ignore a section it does not
# yet implement.
#
#   make album-bake        -> assets/albm1.bin + assets/trackNN.gfp + src/assets.rs
#   make album-pack-check  -> bake twice (byte-identical), the four refusals, the host gate
#
# Q15's ruling (ALBUM-PLAYER.md §15): N entries over ONE properly-encoded master,
# alternating full tracks and short clips so the list carries unequal durations.
# Aliasing serves the flow tests, not the size tests — `ALBM1`'s per-track
# `(offset, len)` is a map, so the two full tracks below address the same packed
# bytes and cost one encode. The censused asset total therefore reports "N B of a
# 33,554,432 B cart" honestly rather than implying a full cart was tested.

[art]
# 2b PR-(4). The cover is tracked (R15); `ART1` is generated by `scripts/album_art.py`.
# `box` must be one the selected variant derives; B's 128x128 is exact on both axes
# (§5.0's table), and the *album* is what selects it — the budget term follows this box,
# not the variant's 256-tile ceiling (Decision B, 2b PR-(4)).
cover       = "assets/images/bioluminescent.jpeg"
mode        = "cover"          # none is legal; cover+breathe is a Phase 4 cadence, refused by name
box         = "128x128"
palette_max = 15
bit_depth   = 4                # 8 is the side-by-side §7 defers; refused by name
bleed       = false            # true is legal in §7 but no variant here declares the tiles for it
dither      = "bayer2"

[album]
title  = "Bioluminescent"
# The tracked master carries **no RIFF tags** (verified: `ffprobe -show_entries
# format_tags` prints nothing for it), so there is no real credit to copy here. Said as
# `unknown` rather than invented — an album artist is metadata a listener would read as fact.
artist = "unknown"
year   = 2026

# One backend per ROM, chosen at build time (§4.2b). `stub` is the silent
# backend the layout tests use; `flac` is the packed `GAFP` path — the only one
# `scripts/gafp_pack.py` can produce today.
[out]
rom        = "album-player.gba"
backend    = "flac"
rate_hz    = 16384            # the packer's rate contract: identity or refusal (Q14)
cart_bytes = 33554432         # 32 MiB, §10.1

# Play order. Titles are exactly what §15's Q15 ruling names — "Bioluminescent 1",
# "Bioluminescent Clip 1", … — and **nothing more**: this file is the one tracked artifact of
# an album build, so a title invented here to exercise a rule would read forever after as
# album metadata that never existed (PR-2 first shipped `Clip 1` as an “Öffnung (Alternate
# Mix, Take 12)” that is not a thing; withdrawn as D5). Q15's "free extra" — one title over
# 28 characters, one carrying non-ASCII — is witnessed where it belongs, in
# `scripts/album_prep.py`'s `FOLD_CASES` and its box report, on strings labelled synthetic and
# covering the whole of §5.5 rather than one accidental word.
#
# `title` is ASCII-folded at bake time (§5.5: NFKD, drop non-ASCII, collapse whitespace, strip
# a whole title wrapped in parentheses) and a title that will not fit its box is **PRINTED,
# never refused** — fixing it is an album decision, not a build failure.
#
# `start_sample`/`end_sample` are optional and, when present, are samples AT THE
# SOURCE'S OWN RATE (probed from its header, not assumed): a clip is extracted
# with ffmpeg to 16,384 Hz stereo s16 before it is packed. They are deliberately
# not rounded — Q15 picks the quietest 50 ms windows of the reference master
# (t≈1.0 s peak 4,093; t≈57.0 s peak 4,297) so a clip boundary cannot be hidden
# by a fade. The album half of `album_prep.py` (Phase 3) owns joining tracks into
# one timeline; in Phase 1 a track's `start_sample` in `ALBM1` is the running sum
# of the tracks before it.

[[track]]
file  = "assets/sound/bioluminescent.wav"
title = "Bioluminescent 1"

[[track]]
file         = "assets/sound/bioluminescent.wav"
title        = "Bioluminescent Clip 1"
start_sample = 96000          # t = 1.0 s at the master's 96,000 Hz
end_sample   = 2976000        # + 30 s

[[track]]
file  = "assets/sound/bioluminescent.wav"
title = "Bioluminescent 2"

[[track]]
file         = "assets/sound/bioluminescent.wav"
title        = "Bioluminescent Clip 2"
start_sample = 5472000        # t = 57.0 s at the master's 96,000 Hz
end_sample   = 8352000        # + 30 s
