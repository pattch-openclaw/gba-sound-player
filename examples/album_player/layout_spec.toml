kind = "text"
band = "chrome"
x0 = 12
y0 = 0
x1 = 20
y1 = 1                       # 9 cols = 72 px = 9 characters at this face's 8 px maximum advance
face = "ark10"
row_px = 16
banks = [0]

[[variant.element]]
id = "keyart"
kind = "art"
band = "chrome"
x0 = 21
