# The Album Player's layout spec — ALBUM-PLAYER.md §5.0.
#
# This file is TRACKED: it belongs to the application, not to an album (§5.0's
# "the spec belongs to the application, not to an album, so it is tracked;
# layout.rs is build output — pinned, clean-ed, regenerated by album-bake"). What
# it generates, `examples/album_player/src/layout.rs`, is gitignored and is the
# only place any of these numbers reaches Rust. `album.toml`'s part is one line —
# `[layout] variant = "B"` — and *config selects a variant; it never produces
# runtime geometry* (§5.0).
#
# Two things this file is not, and §5.0 is emphatic about both:
#   * It is not a description of a screen in pixels. Every box here is in TILES,
#     because that is the unit the hardware and agb's tile pool allocate in. A
#     band's `rows` is a count of 8 px tile rows, never a count of text rows: a
#     text row count is a *consequence* (`floor(region_height / row_px)`) and
#     quoting one is the mistake §11's D9 records.
#   * It is not a wish list. `album-layout-gen` (inside `scripts/album_bake.py`)
#     validates it against §9.0's register before a line of Rust compiles, and
#     derives from it the art-box list, the title-fit box, the list window, the
#     bar grid and the tile-pool audit. `make album-layout-test` is that gate.
#
# A and B are §5.0's two mock variants: A is `product = false` — the development
# instrument for face and dither questions, with §5.5's 8 px cut and a title band
# that carries no text line — and B is `product = true`, the first
# product-shaped variant at a 16 px pitch. AP-3 snapshots B and prints A as
# skipped-with-reason (§13's AP-3 row), which is what `product` exists for
# (§5.5's ruling that the 8 px cut is an instrument face and not a product face).
#
# Neither is final, and §5.0 says so: changing the default is one line in
# `album.toml` and a re-run of a host test. What is not open is declared here as
# a rule the generator enforces: a pitch that is not a whole tile row or is below
# the declared face's line box (`pitch-not-tileable`), a face that is not a
# tracked, licensed asset (`face-not-resolvable`), a scene region that holds fewer
# than four text rows (`scene-minimum`), a `resident_scenes` above the hardware
# cap of 3, and a pool sum over `tile_budget` (`image-tiles-over-budget`).

# --- hardware facts the spec is checked against, not fields to tune ----------
# `album-layout-gen` refuses a spec that disagrees with these (§5.0: the screen is
# 240x160 px = 30x20 tiles; agb's `Background32x32` map is 32x32 entries, so two
# columns of the map are off-screen; the regular BG tile pool agb 0.25 hands out
# is 512 4bpp slots in total, not per block (§5.1, R14); and Mode 0 has four
# background layers, one of which chrome owns permanently, so three content scenes
# is the honest ceiling (§5.0's `resident_scenes` cap, refused at bake time)).
[meta]
screen_tiles = [30, 20]      # 240 x 160 px, the visible area
map_tiles = [32, 32]         # agb RegularBackgroundSize::Background32x32
tile_px = 8
pool_slots = 512
resident_scene_max = 3

# --- declared faces ---------------------------------------------------------
# §5.5: the unit of a font decision is a *cut*, not a family; the ROM carries one
# declared face compiled into one atlas. A face entry is a tracked .ttf, the raster
# it is declared at, and the licence rows that let it be shipped.
# `product_face = false` is §5.5's ruling about the 8 px cut, stated as a property
# of the asset so a `product = true` variant cannot quietly declare it: that
# contradiction is a spec error, not a register refusal (the register names no row
# for it, because legibility is §5.6's human leg).

[[face]]
id = "ark10"
file = "assets/fonts/ark-pixel-10px-proportional-latin-ascii.ttf"
raster = 10
product_face = true
licence = ["assets/fonts/OFL.txt"]
parent = "assets/fonts/ark-pixel-10px-proportional-latin.ttf"
# Q19's recommended 2a default, re-ruled at the second review: an ASCII cut of the
# `ark-pixel-10px` OFL face this repo already tracks. It rasterises exactly at its
# design size (every advance in U+0020-U+007E is an integer at raster 10, and no
# glyph is off-grid — measured again on the cut itself while generating this
# entry), its line box is 16 px which is the pitch floor §5.0's rule makes
# minimum, and its ink is 9 px tall against the instrument's 8 px. The cut is
# `assets/fonts/README.md`'s documented `pyftsubset` command; it is 7,820 B and
# 96 glyphs (95 mapped codepoints, U+0020-U+007E).

[[face]]
id = "fusion8"
file = "assets/fonts/fusion-pixel-8px-proportional-latin-ascii.ttf"
raster = 8
product_face = false
licence = ["assets/fonts/fusion-pixel-OFL.txt", "assets/fonts/fusion-pixel-LICENSES"]
# The 96-glyph ASCII cut `assets/fonts/README.md` documents, and the face
# `examples/album_player/src/text.rs` draws the verdict screen with (AP-7a's
# legible `PASSED` is witnessed in it, which is the point: this stays exactly
# where it is). Declared here by the *instrument* variant and by nothing that may
# ship. Its line box is 12 px, so the smallest pitch it can be drawn at is still
# 16 px — which is why A's 1-row title band carries no text element at all.
# No tracked parent: the cut is the tracked asset (`assets/fonts/README.md`).

# --- the variants -----------------------------------------------------------

[[variant]]
id = "A"
product = false
# §5.0's mock, first row: 2 rows of chrome, a 1-row title band that carries no
# text line (art/bar only), and a 17-row scene region — 240x136 px, which is 510
# tiles if filled edge to edge. The region is not the budget: `image_tiles` is.
tile_budget = 512
resident_scenes = 1          # 2a has one scene: `blank`. 2b's projection is printed, not claimed.

# 15x15 tiles = 120x120 px: §5.0's A ceiling, and the number the pool audit takes
# the image term at. A's region would physically hold a 17x17 box (289 tiles) and
# a 16x16 one (256); what stops both is the pool, which is exactly the difference
# §5.0 draws between `scene_region` and `image_tiles`.
image_tiles = 225

# §6's fine grid, at the value §6 names as A's starting default: 18 cells in the
# 72 px this variant's title band carries = 4 px per cell, i.e. 9 cells of 8 px
# redrawn as 18 of 4 px "at the cost of ~5 extra pattern tiles" — which the
# generator derives (4 px cells -> 5 pattern tiles) and prints rather than estimates.
bar_cells = 18

# §5.1's BG0 term: the backdrop fills that tile the bands and the region's opaque
# backing, plus the authored control art for §5.3's keys in the slots declared
# below. Counted as *distinct tiles in the pool*, which is what agb's allocator
# hands out — the map entries themselves are the 2,048 B screenblock, a separate
# term (§5.1). Enumerated so a reviewer can argue with the number: 4 backdrop
# fills (one per band, one for the region's backing), and one 8x8 tile per
# declared control slot (5).
chrome_art_tiles = 9

# 2a's baseline text mechanism (§5.5a): the static glyph atlas, addressed by index,
# so a repeated letter is one tile. The alternative is today's
# `RegularBackgroundTextRenderer`, which allocates per *cell* — that is the upper
# bound in §5.1's table, and a variant that declared it would be refused at that
# bound, which is the honest reading of §5.1's "flags the atlas variant rather than
# refusing it".
glyph_atlas = "static"

# §5.4's allocation, as the ranges this variant may use. The generator checks every
# element's declared bank against these (an out-of-allocation bank is a spec error,
# not a register row: §9.0 gives the palette refusals to 2b, about real images).
[[variant.palette]]
role = "text"
banks = [0]                  # 0 backdrop, 1 glyph, 2 dim, 3 accent (§5.4)

[[variant.palette]]
role = "chrome"
banks = [1, 2]               # the bar and the control art

[[variant.palette]]
role = "art"
banks = [3, 4, 5, 6]         # up to 4 x 15 colours (§5.4); 2b fills them

[[variant.palette]]
role = "viz"
banks = [7, 8, 9, 10]        # declared for Phase 4; no 2a element may use these

[[variant.palette]]
role = "game"
banks = [11, 12, 13, 14, 15] # reserved, unusable by any element of this variant

# The band stack, bottom-up: the bottom bands are always shown, the region is the
# swappable part (§5.0). Rows are tile rows; the three must tile exactly 20.
[[variant.band]]
id = "chrome"
rows = 2
always = true

[[variant.band]]
id = "title"
rows = 1
always = true                # A's title band draws the bar and nothing with a line box

[[variant.band]]
id = "scene"
rows = 17
always = false               # the region: 240x136 px

# The scene registry, in the order `Select` cycles it (§5.3's Select row: the
# order is a declared field and Q20 owns the answer, so this is §5.3's documented
# order marked as Q20's to settle, not a choice made here). `phase` is which phase
# builds the scene, and the minima are §5.2's scene table's, per scene, not a
# global number (`scene-minimum`).
[[variant.scene]]
name = "art"
phase = "2b"
band = "scene"
min_boxes = 1                # §5.2's art row: a box outside its own region, and nothing smaller than one box

[[variant.scene]]
name = "list"
phase = "2b"
band = "scene"
min_visible_rows = 4         # §5.2: "a variant whose region holds under ~4 rows at its declared pitch, where a list has stopped being a list"

[[variant.scene]]
name = "title_card"
phase = "2b"
band = "scene"
# No element declared at 2a: 2a's ROM draws the chrome and `blank` and nothing
# else, so there is no geometry here to derive. The generator reports that as a
# named-and-skipped row rather than inventing spans for a scene 2b owns.

[[variant.scene]]
name = "blank"
phase = "2a"
band = "scene"
# §5.2's `blank` row: a flat fill of the region at a declared palette entry. Its
# whole purpose is that 2a needs no asset, no art tool and no new font.

[[variant.element]]
id = "clock"
kind = "text"
band = "chrome"
x0 = 0
y0 = 0
x1 = 11
y1 = 1                       # 12 cols = 96 px, a full 16 px line
face = "fusion8"
row_px = 16
banks = [0]
# "3:47 / 12:34" is 12 characters, which at this face's 6 px maximum advance is
# 72 px and inside the box; §6's ruling that the chrome shows `elapsed / total`
# is what sets the string's shape, and the element's width is arithmetic
# (max_advance x characters), not taste.

[[variant.element]]
id = "keylabels"
kind = "text"
band = "chrome"
x0 = 12
y0 = 0
x1 = 20
y1 = 1
face = "fusion8"
row_px = 16
banks = [0]
# §5.6's "a control's drawn state plus a word": the words go here, beside the
# authored glyphs. 9 columns = 72 px = 12 characters at this face's 6 px maximum.

[[variant.element]]
id = "keyart"
kind = "art"
band = "chrome"
x0 = 21
y0 = 0
x1 = 29
y1 = 1
banks = [1]
# The authored control art for §5.3's transport, in the slots below.

[[variant.element]]
id = "bar"
kind = "bar"
band = "title"
x0 = 0
y0 = 0
x1 = 8
y1 = 0                       # 9 cols = 72 px, one tile row

[[variant.element]]
id = "art"
kind = "art"
band = "scene"
scene = "art"
x0 = 0
y0 = 0
x1 = 29
y1 = 16                      # the region as the element may draw in; the boxes come from `image_tiles`
banks = [3, 4, 5, 6]

[[variant.element]]
id = "list"
kind = "text"
band = "scene"
scene = "list"
x0 = 0
y0 = 0
x1 = 29
y1 = 16
face = "fusion8"
row_px = 16
banks = [0]
# Declared at 2a even though the list *scene* is 2b's: row_px and the face are 2a's
# fields, so the window is derived and refused at 2a and 2b builds into a rectangle
# whose size is already settled (§11's note (i) on the 2a row).

[[variant.control]]
key = "select"               # §5.3: cycle the scene
band = "chrome"
slot = "keyart"
x0 = 21
y0 = 0
x1 = 21
y1 = 0

[[variant.control]]
key = "start"                # §5.3: pause (equivalent to A)
band = "chrome"
slot = "keyart"
x0 = 22
y0 = 0
x1 = 22
y1 = 0

[[variant.control]]
key = "right"                # §5.3: next track (R)
band = "chrome"
slot = "keyart"
x0 = 23
y0 = 0
x1 = 23
y1 = 0

[[variant.control]]
key = "left"                 # §5.3: previous track (L)
band = "chrome"
slot = "keyart"
x0 = 24
y0 = 0
x1 = 24
y1 = 0

[[variant.control]]
key = "down"                 # §5.3: restart the current track
band = "chrome"
slot = "keyart"
x0 = 25
y0 = 0
x1 = 25
y1 = 0

# Each control slot is one 8x8 authored tile inside the `keyart` element's box.
# The one-row placement is a guess about vertical centring that 2a-3 (which draws
# the chrome) may move within the band; the slot *count* and the columns are what
# the art is authored against, and at a 16 px pitch a glyph 8-9 px tall is not
# vertically centred by a one-row slot — said here rather than discovered on
# hardware.

[[variant]]
id = "B"
product = true
# §5.0's mock, second row: 2 rows of chrome, a 2-row title band with the bar along
# the lower row, and a 16-row scene region — 240x128 px, 480 tiles edge to edge,
# which is 8 text rows at the 16 px pitch and nothing else.
tile_budget = 512
resident_scenes = 1          # 2a: `blank` only. 2b's art + list + blank is exactly the cap of 3, and that is printed.

# 16x16 tiles = 128x128 px: the largest box this region can hold, and §5.0's B
# ceiling ("it fills the region's rows and takes 7 columns of margin each side").
image_tiles = 256

# One cell per pixel column of the element this variant declares: the `bar`
# element below is 10 columns = 80 px, so `bar_cells = 80` is a grid of one
# pixel per cell, and the generator derives `cell_px = 80 / 80 = 1` rather than
# being told it. §6's coarse examples (32 cells → 3.1%, 18 → 5.6%, 9 → 11%) are
# quoted per *cell quantum*; a 1 px cell in an 80 px box is a 1.25 % quantum, so
# the product variant is finer than the shipped pack's 32-cell figure at no extra
# cost in the draw path: the fill boundary inside an 8 px tile can land at 0..7
# px, and the generator derives 9 pattern tiles for that (8 partial + full),
# against a 512-tile pool. What §6 makes mandatory is *agreement* — declared
# value = the reciprocals in `ALBM1` = the value in `src/layout.rs` — and §6's
# floor of 16 cells; both hold here, and the row that fires if they split is
# `bar-cells-disagree`.
#
# This line read `bar_cells = 30` when it was written, with a comment describing
# "one cell per pixel column of the whole 240 px screen". That was a number about
# the screen's 30 tile columns, not about the box that was declared beside it, and
# the first run of the generator refused it for exactly that reason: 30 does not
# divide 80 into whole pixels (2.67 px per cell), and a fractional cell is a divide
# in the UI path, which §6's AP-2 leg refuses. Corrected at the generator, in the
# spec that owns the number, and recorded here rather than silently edited.
bar_cells = 80

chrome_art_tiles = 9         # as A: 4 backdrop fills + one tile per declared control slot
glyph_atlas = "static"

