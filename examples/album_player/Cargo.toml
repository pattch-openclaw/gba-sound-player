[package]
name = "album-player"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# The Album Player's Phase 1 crate (ALBUM-PLAYER.md §11 "Phase 1", §13 AP-1).
#
# PR-2 landed the pack half: `src/meta.rs` is the validating `ALBM1` reader and
# `src/assets.rs` is generated by `make album-bake`. PR-3 adds the rest — the
# `PcmSource` seam, the `backend/{flac,stub}` pair, the derived `geometry`, and the
# `[[bin]] album-play` ROM main (`make album-rom`, below).
#
#   make album-bake        generate assets/albm1.bin + assets/trackNN.gfp + src/assets.rs
#   make album-pack-check  bake twice (byte-identical), the four refusals, this crate's host gate
#   make album-seam-test   the seam's host gate, plus the stub-only build that links no codec
#   make album-rom         bake, then build + fix the ROM; run it with mgba-test-runner
#
# Standalone workspace, cargo config INHERITED from the repo root — do NOT add a
# local .cargo/config.toml: cargo concatenates target.<triple>.rustflags across
# config layers, and a local re-declaration links `-Tgba.ld` twice.
#
# The library is platform-free (`src/lib.rs`): the host suite compiles it for the
# host triple, and the ROM main compiles the same modules for the GBA. `agb` and
# `gba-audio-hw` are the bin's dependencies, declared below in the ARM target
# block: the library itself still writes no register and constructs no timer.
#
# `src/assets.rs` is a GENERATED, gitignored file. A fresh clone does not have
# it, so `make check` formats this crate through
# scripts/fmt_with_generated_stub.sh's GENERATED override; a bare `cargo fmt`
# here would fail on the missing `#[path]`-resolved module.

[dependencies]
# §6's no-divide arithmetic, from the crate that owns it (ALBUM-PLAYER.md §2.2,
# §6). Lifted out of `examples/album_probe/src/nodiv.rs` in Phase 1 PR-2: the
# probe, this crate and their host gates all paint from one implementation, and
# the app may not `#[path]`-include anything under a probe directory.
gba-playback = { path = "../../crates/gba-playback" }
# The shipped backend's decoder (§4.2b). Optional so a stub-only image
# (`--no-default-features --features backend-stub`) links no codec at all —
# that arm is AP-9's "the UI cannot know which codec it drives" witness, and the
# seam's host gate builds it explicitly. `iwram-pin` opts in to the core's .iwram
# placement; `scan` makes the manifest facade a shell over the frame walk, which
# is what lets the boot gate cross-check a container's frame count.
flac-lite = { path = "../../crates/flac-lite", features = ["iwram-pin", "scan"], optional = true }

# The overlay's ARM-mode Rice kernel (feature `arm-kernel`), ARM-only by
# construction: `flac-lite-gba`'s kernel is written over the core's
# `residual::RiceKernel` seam for thumbv4t. Under the arm target block so a host
# build of this library never names it — the host gate decodes the same fixture
# blobs through the core's default kernel.
[target.'cfg(target_arch = "arm")'.dependencies]
flac-lite-gba = { path = "../../crates/flac-lite-gba", optional = true }
# The ROM's bootstrap (PR-3a step iii): `agb` for the entry point, the timers and the
# interrupt registry, and `gba-audio-hw` for the sound chain itself (§2.2's lift — the
# app may not `#[path]`-include the spike or the probe). Both arm-only: the library
# and the host gates are platform-free, and the bin's host build is an empty `main`.
agb = "0.25.0"
gba-audio-hw = { path = "../../crates/gba-audio-hw" }

# The ROM main (PR-3a step iii). No local `.cargo/config.toml` anywhere in this crate:
# the root one is inherited, and a local re-declaration links `-Tgba.ld` twice.
[[bin]]
name = "album-play"
path = "src/album_play_main.rs"

[features]
default = ["backend-flac", "backend-stub", "arm-kernel", "deep-audit"]
# The shipped backend: packed `GAFP` blobs through flac-lite.
backend-flac = ["dep:flac-lite"]
# The synthetic backend: deterministic int16 stereo, no codec, no platform.
backend-stub = []
# Decode through the overlay's `ArmRiceKernel` instead of the core's
# `TableCountKernel` — the same kernel A/B `examples/flac_integration` carries
# (its Cargo.toml's `arm-kernel` block, mirrored).
arm-kernel = ["dep:flac-lite-gba", "flac-lite-gba/rice-arm", "flac-lite-gba/iwram-pin"]
# The post-audio content proofs: the cold re-decode with its `pcm`/`fifo` folds and
# the full `fnv_assets` region fold. ~75 s of CPU (measured: proof 817,429,485 c +
# asset fold 439,233,721 c) — right for a gate artifact, wrong for something a human
# sits in front of. IN `default` on purpose: `make album-rom` must keep producing the
# audited artifact AP-1 runs, and an off-by-default witness is one a gate can skip.
# `make album-player-rom` builds without it and says so in its verdict line.
deep-audit = []
# Replay a compiled-in `(frame, mask)` key script at the keys layer instead of reading the keypad
# (`keys::Replay`). OFF by default: every shipped artifact is a HARDWARE build, and a REPLAY run is
# never evidence that a physical press works — that is AP-7's, on a cartridge. It exists because
# `mgba-test-runner` cannot inject input (a positional ROM argument and no key-log, stdin, env or
# socket path), so the gate's witness is the same state machine fed a scripted log (§5.3, §13 AP-1).
# The ROM prints which source it used, always.
input-replay = []
# R13's diagnostic scenarios: each selects a different compiled-in script for the REPLAY arm,
# matching a press pattern from the 2026-11-17 hardware session (`src/album_play_main.rs`,
# `REPLAY_SCRIPT_A/B/C`). With none of them set the arm replays the gate's script, so
# `make album-test` builds and asserts exactly what it did before. `make album-seam-test` and
# `make album-pack-check` do not build the REPLAY arm and are untouched.
replay-script-a = ["input-replay"]
replay-script-b = ["input-replay"]
replay-script-c = ["input-replay"]
# 2b PR-(3): the gate script plus one `Select` edge — the card's runtime witness.
replay-script-card = ["input-replay"]
# Hardware diagnostic, never a product image: omit the explicit transparent page fill that
# `Painted::new` writes over every visible cell of the three backgrounds. With the fill, no visible
# cell depends on agb's reserved blank VRAM tile; without it, a Quick-Boot loader that leaves VRAM
# uninitialised shows whatever was there. `make album-diff-rom` builds the pair so the two can be
# flashed side by side. Off by default; a default build always includes the fill.
no-page-fill = []

[[test]]
name = "album_pack_host"
path = "tests/album_pack_host.rs"

[[test]]
name = "album_seam_host"
path = "tests/album_seam_host.rs"

[workspace]

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
