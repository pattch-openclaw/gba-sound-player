[package]
name = "album-player"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# The Album Player's Phase 1 crate (ALBUM-PLAYER.md §11 "Phase 1", §13 AP-1).
#
# PR-2 lands the pack half only: `src/meta.rs` is the validating `ALBM1` reader
# and `src/assets.rs` is generated by `make album-bake`. Nothing here plays
# audio yet — `PcmSource`, the `backend/{flac,stub}` pair and the ROM main are
# PR-3's, and no binary is declared until they exist.
#
#   make album-bake        generate assets/albm1.bin + assets/trackNN.gfp + src/assets.rs
#   make album-pack-check  bake twice (byte-identical), the four refusals, this crate's host gate
#
# Standalone workspace, cargo config INHERITED from the repo root — do NOT add a
# local .cargo/config.toml: cargo concatenates target.<triple>.rustflags across
# config layers, and a local re-declaration links `-Tgba.ld` twice.
#
# The library is platform-free (`src/lib.rs`): the host suite compiles it for the
# host triple, and a later ROM compiles the same modules for the GBA. There is
# deliberately no `agb` dependency yet — a decoder or a register write in this
# crate before PR-3 would be the wrong half of the phase.
#
# `src/assets.rs` is a GENERATED, gitignored file. A fresh clone does not have
# it, so `make check` formats this crate through
# scripts/fmt_with_generated_stub.sh's GENERATED override; a bare `cargo fmt`
# here would fail on the missing `#[path]`-resolved module.

[dependencies]
# §6's no-divide arithmetic, from the crate that owns it (ALBUM-PLAYER.md §2.2,
# §6). Lifted out of `examples/album_probe/src/nodiv.rs` in Phase 1 PR-2: the
# probe, this crate and their host gates all paint from one implementation, and
# the app may not `#[path]`-include anything under a probe directory.
gba-playback = { path = "../../crates/gba-playback" }
# The shipped backend's decoder (§4.2b). Optional so a stub-only image
# (`--no-default-features --features backend-stub`) links no codec at all —
# that arm is AP-9's "the UI cannot know which codec it drives" witness, and the
# seam's host gate builds it explicitly. `iwram-pin` opts in to the core's .iwram
# placement; `scan` makes the manifest facade a shell over the frame walk, which
# is what lets the boot gate cross-check a container's frame count.
flac-lite = { path = "../../crates/flac-lite", features = ["iwram-pin", "scan"], optional = true }

# The overlay's ARM-mode Rice kernel (feature `arm-kernel`), ARM-only by
# construction: `flac-lite-gba`'s kernel is written over the core's
# `residual::RiceKernel` seam for thumbv4t. Under the arm target block so a host
# build of this library never names it — the host gate decodes the same fixture
# blobs through the core's default kernel.
[target.'cfg(target_arch = "arm")'.dependencies]
flac-lite-gba = { path = "../../crates/flac-lite-gba", optional = true }

[features]
default = ["backend-flac", "backend-stub", "arm-kernel"]
# The shipped backend: packed `GAFP` blobs through flac-lite.
backend-flac = ["dep:flac-lite"]
# The synthetic backend: deterministic int16 stereo, no codec, no platform.
backend-stub = []
# Decode through the overlay's `ArmRiceKernel` instead of the core's
# `TableCountKernel` — the same kernel A/B `examples/flac_integration` carries
# (its Cargo.toml's `arm-kernel` block, mirrored).
arm-kernel = ["dep:flac-lite-gba", "flac-lite-gba/rice-arm", "flac-lite-gba/iwram-pin"]

[[test]]
name = "album_pack_host"
path = "tests/album_pack_host.rs"

[[test]]
name = "album_seam_host"
path = "tests/album_seam_host.rs"

[workspace]

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
