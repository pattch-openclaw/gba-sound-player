[package]
name = "symphonia-flac-probe"
version = "0.1.0"
edition = "2024"

# Standalone compile probe for FLAC evaluation (see ../../FLAC.md).
# This example is EXPECTED TO FAIL COMPILATION for thumbv4t-none-eabi.
# It documents the exact integration attempt against the keks symphonia
# no-std fork; the failure is the deliverable.
#
# Build (native only; no podman/docker on this host):
#   cd examples/symphonia_flac_probe
#   cargo +nightly build --release --target thumbv4t-none-eabi
#
# First errors (build aborts in the dep graph; which crate aborts first depends
# on cargo's parallel build order — both reproduce):
#   error[E0463]: can't find crate for `std`
#    --> lazy_static-1.5.0/src/inline_lazy.rs:9:1   (via symphonia-core / symphonia-metadata)
#   error: could not compile `lazy_static` (lib) due to 1 previous error
#   error[E0463]: can't find crate for `std`
#    --> num-traits-0.2.19/src/lib.rs:23:1          (via symphonia-core → num-complex)
#   error: could not compile `num-traits` (lib) due to 1 previous error

[dependencies]
agb = "0.25.0"
symphonia-bundle-flac = { git = "https://github.com/keks/Symphonia", branch = "chore/core-step-towards-nostd-0.6" }

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
