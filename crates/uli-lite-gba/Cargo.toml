[package]
name = "uli-lite-gba"
version = "0.1.0"
edition = "2024"
description = "GBA overlay for uli-lite: ARM-mode synthesis kernels (measurement realisation)"
# Licensing of the ULI2 format/reference is unresolved; see ../../ULI2.md.
publish = false

# Standalone workspace, like crates/flac-lite-gba: the root ROM crate's target
# config must not leak into host-side tests, and vice versa.
[workspace]

[dependencies]
# `kernels` exposes the portable kernels (the correctness reference) and the
# synthesis tables the overlay twin is tested against.
uli-lite = { path = "../uli-lite", features = ["kernels", "product"] }

[features]
# The product synthesis path is the fast path by default: the hand-written ARM
# FFT (v4) and the synthesis tables in `.iwram` (the C reference's own layout).
# Both are measured wins and both now fit the IWRAM budget (6,196 B headroom
# after the 768 B measured product stack). The Rust ARM-mode `fft` is still
# compiled and is still the control the bench times in the same image
# (`frame core`, and the isolated `kern`/`ovl` arms), so turning the fast path on
# does not remove the comparison — it just stops the product being slow by
# default. Use `--no-default-features` to get the pure-Rust-kernel build.
default = ["asm-fft", "asm-pre", "asm-ola", "asm-post", "asm-ms", "iwram-tables"]

# Operation counts (`Ops`) and format-rule diagnostics (`xover`/`hfnz`) on the
# hot path. Off by default: they cost ~30,000 cycles on the measured worst frame
# (PR C-3b), because they are a counter increment per symbol and two compares per
# nonzero coefficient. The product build compiles them out; every witness that
# quotes `FrameInfo::ops`/`cycles`/`xover`/`hfnz` (the twins) must build with this
# on, and `examples/uli_bench` gates its ops line on it. The format rules are
# still witnessed in a product build by the core decoder's pass in the bench.
verify = []

# Copies the 8,672 B of synthesis tables (PERM/PRE/POST/TW/WIN) into `.iwram`
# instead of reading them from the cartridge. This is the C reference's own
# layout (it keeps all five tables in IWRAM), and it is the single largest
# placement win measured: product frame 411,431 -> 387,879 (157% -> 148%),
# because PRE/POST/WIN are read on every pre/post/OLA sample. It now fits
# (`.iwram` 23,532 B of 32,512, 768 B measured stack) after the stale ~15 KiB
# stack figure was withdrawn — see PLAN-OF-RECORD.md "Memory layout".
# **On by default.**
iwram-tables = []

# Only the FFT twiddle table (TW, 504 words = 2,016 B) in `.iwram`. This was the
# isolating A/B that found the placement lever (FFT 69,034 -> 61,852, -10.4%);
# `iwram-tables` now delivers more and is on by default, so this is retained only
# to reproduce that A/B. It is a no-op when `iwram-tables` is on.
iwram-tw = []

# Hand-written ARM FFT kernels (`asm/`, PR C-1): v1 (fft_arm.s), v2, v3, v4.
# With this on, `fft_kernel` (and so `ArmKernels::fft` and the product
# `GbaDecoder`) call the best variant, **v4** (`fft_arm_v4.s`, block transfers +
# trivial butterfly); v1/v2/v3 stay addressable via `fft_asm_call` etc. as
# measured comparison arms. Only assembles for `target_arch = "arm"`; the host
# twin exercises the dispatch and falls back to the Rust kernel. **On by
# default** — the Rust ARM-mode `fft` remains the in-image control (`frame
# core`, `kern`, `ovl`).
asm-fft = []

# Hand-written ARM pre-twiddle (`asm/pre_arm.s`): four post-indexed cursors and
# one `stmia` per output pair, matching the reference's loop shape — 11
# instructions per pair where LLVM's is 15. The four multiplies are the
# algorithm's own. On by default, with the Rust ARM-mode `pre` left in place as
# the in-image control.
asm-pre = []

# Hand-written ARM window + overlap-add (`asm/ola_arm.s`): six post-indexed
# cursors, the reference's `sat16`-then-`asr #8` clamp idiom and a single
# `ldr`/`str` pair for the overlap word — 26 instructions per iteration where
# LLVM's is 33. On by default, with the Rust ARM-mode kernels left in place as
# the in-image control.
asm-ola = []

# Hand-written ARM mid/side transform (`asm/ms_arm.s`): two `ldmia`, eight ALU
# ops and two `stmia` per **four** coefficients — 14 instructions per 4 against
# the Rust scalar loop's 9 per 1. M/S was the last hot loop with no kernel at
# all and the worst ratio in the decoder (9,861 cycles at the gate frame,
# 2.24x the C record's ~4,400); see PLAN-OF-RECORD.md "Root-cause audit
# (2026-11-16)". On by default, with the Rust loop left in place as the
# in-image control.
#
# M/S is pure ALU, so unlike `pre`/`fft`/`post`/`ola` there is no multiplier
# `Rs` early-termination question here: the only lever is the load/store shape.
asm-ms = []

# Hand-written ARM post-twiddle (`asm/post_arm.s`): the reference's 14-instruction
# loop in place of LLVM's 18, which was the last Rust kernel on the product path.
# Measured 23,682 cycles at the gate frame / 23,458 mean against the C record's
# 21,800, and it is the one kernel whose excess is nameable in instructions
# rather than frame density. On by default, with the Rust `post` left in place as
# the in-image control.
asm-post = []

# **Measurement-only: by-difference attribution arms.** Each flag removes exactly
# one part of the product frame so `examples/uli_bench` can attribute the frame
# by difference inside one source tree (PR C's method; see PLAN-OF-RECORD.md
# "Critical path to real time", Step 0). They are **timing-only**: the removed
# work changes the decoded samples, so the bench's pins fail by construction in
# these builds and only the timed window is quoted. The flags are const-folded
# out, so the default build (none on) is textually the product frame. Never
# ship a build with any of them on.
#
# Every arm implies `attrib-timing`, which only relaxes frame rejection: a
# removed layer desynchronises the bit stream, and a rejected frame would abort
# the run instead of measuring it. It is inert in the product build.
attrib-timing = []
attrib-pre = ["attrib-timing"]
# **Measurement-only: the clean `pre` arm (2026-11-18).** `attrib-pre` *removes*
# `pre`, which leaves a stale `z` for the FFT to multiply — and the FFT\'s cost is
# data-dependent through `Rs`, so that delta is `pre` + a change in the FFT\'s
# cost. `attrib-pre2` instead calls `pre` a **second time**: `pre` is idempotent
# (deterministic function of `x` into `z`), so the second call writes the same
# bytes and every downstream stage sees exactly the data it would have, while the
# delta is one real `pre` call. One of the **bit-exact** arms (`-pre2`/`-fft2`/
# `-post2`/`-entropy2`), so its pins PASS and the number is not confounded.
attrib-pre2 = []
# The clean `post` arm: `post(z, y)` writes `y` from `z` and touches nothing
# else, so a second call is idempotent. Delta = one real `post`; bit-exact.
attrib-post2 = []

# **The clean entropy arm.** `attrib-entropy` *removes* `dec_chan`, which freezes
# the bit cursor so every frame synthesises one stale spectrum — the delta then
# contains the whole synthesis block's change, not the entropy path.
# `attrib-entropy2` replays each channel from a **saved `BitReader`** (it is
# `Copy`): the replay writes byte-identical coefficients and returns the same
# cursor, so everything downstream is unperturbed and the delta is exactly one
# channel decode. Bit-exact, so pins PASS.
attrib-entropy2 = []
# **The checked bit reader.** Off by default: the product build reads the stream
# closed-world — no bounds test, no error flag, a 16-bit refill contract — because
# the bake gate decodes the whole album with the checked *portable* decoder
# against the C-pinned hashes before the ROM exists (`PLAN-OF-RECORD.md`, "the
# entropy path against the C+ASM reference", P1). Turning this on restores
# `end`/`bad`, the per-load bounds test, the 17-bit contract and the per-symbol
# and per-escape guards.
#
# **The attribution arms require it**, and get it through `attrib-dump` in
# `examples/uli_bench`: a by-difference arm removes a stage, which desynchronises
# the bit stream, and `bad` is what lets the arm resynchronise instead of reading
# past the end of the stream. Keeping every attribution image on the checked
# reader also keeps their deltas comparable to each other.
checked-reader = []
# **The clean `fft` arm (2026-11-19).** `fft` is in place on `z` (`buf`), so unlike
# `pre`/`post`/`dec_chan` it cannot simply be called twice: the second call would
# transform already-transformed data and every later stage would see a different
# spectrum. `attrib-fft2` therefore *restores* the input first — it calls `pre`
# again (idempotent), then `fft` again — which puts `z` back to exactly the bytes
# the first `fft` saw. Pins PASS, so the arm is bit-exact.
#
# **Its delta is `pre` + `fft`, not `fft`.** Subtract `attrib-pre2`'s delta, which
# is exactly one `pre` call on the same data, to get the FFT alone:
#   `fft = delta(attrib-fft2) - delta(attrib-pre2)`
# Both images are bit-exact and both pass the pins, so neither term is confounded
# by a desynchronised bit stream (which is what makes the existing removal arm
# `attrib-fft` unusable for this: `fft` is the one row in the kernel table that is
# *derived* rather than measured, because it is in place).
attrib-fft2 = []
attrib-fft = ["attrib-timing"]
attrib-post = ["attrib-timing"]
attrib-ola = ["attrib-timing"]
# All eight synthesis calls (2 x pre+fft+post+ola) removed: what remains is
# entropy + dequant + M/S + the frame wrapper.
attrib-synth = ["attrib-pre", "attrib-fft", "attrib-post", "attrib-ola"]
# `dec_chan` removed for both channels: entropy, dequant and the zero-band fills
# vanish, and with `nb = 0` the M/S loop is skipped too. What remains is
# synthesis + the frame wrapper.
attrib-entropy = ["attrib-timing"]
# The M/S coefficient transform removed on its own (the frame header is kept, so
# the decoded band count is still read).
attrib-ms = ["attrib-timing"]

# **Measurement-only: sub-frame entropy attribution (Step 0b).** `attrib-entropy`
# above removes the whole band decoder; these four remove one layer *inside* it
# so the ~101,000 cycles it owns at the worst frame can be partitioned before the
# rewrite lands. Same rules: timing-only, pins fail by construction, never ship.
#
# Two of them are strict removals that leave the bit stream untouched (so the
# frame still decodes the same symbols and the delta is one layer):
#   nodequant — the `rq` load and the `step` multiply (the magnitude is stored).
#   nowrite   — the store into `x` (the arithmetic still runs).
# Two substitute a fixed-width read for symbol resolution, so their bit volume
# differs from the real stream and their deltas price *resolution plus the bits
# it consumes*, not the lookup alone:
#   nolut     — every Huffman symbol is a fixed `LUTB`-bit skip.
#   reader    — the band loop is replaced by a replay of the frame's *true* bit
#               count (`GbaDecoder::replay_bits`), i.e. refill/skip mechanics at
#               the real volume with no symbols, dequant or stores at all.
attrib-entropy-nolut = ["attrib-timing"]
attrib-entropy-nodequant = ["attrib-timing"]
attrib-entropy-nowrite = ["attrib-timing"]
attrib-entropy-reader = ["attrib-timing"]

# Counts `huff_slow` hits (the canonical search off the LUT) for the sub-frame
# attribution. Off by default: it is a counter increment per long code (~32 per
# worst frame), which is a rounding error on the frame but is still not the
# product build. `Ops::long_codes` carries the same number in a `verify` build;
# this exists because the target `verify` image fails the `ovl` pin at HEAD.
attrib-count = []

[lib]
name = "uli_lite_gba"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = "fat"
